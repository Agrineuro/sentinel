services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      API_PREFIX: /api/v1
      DATABASE_URL: sqlite:////data/sentinel.db
      HEALTH_POLL_INTERVAL_SECONDS: ${HEALTH_POLL_INTERVAL_SECONDS:-30}
    volumes:
      - sentinel_data:/data
    expose:
      - "18101"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18101/api/v1/health',timeout=3)); raise SystemExit(0 if d.get('status') == 'healthy' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${SENTINEL_PORT:-8080}"
        host_ip: "${SENTINEL_BIND:-127.0.0.1}"
        protocol: tcp
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel_data:
